<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes leafFall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #d97757 0%, #b85d3a 25%, #9d4a2f 50%, #8b3e26 75%, #7a3420 100%);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .leaf {
            position: absolute;
            font-size: 20px;
            opacity: 0.6;
            animation: leafFall linear infinite;
        }

        .countdown-box {
            background: #fef9f3;
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 10;
        }

        .emoji-row {
            text-align: center;
            font-size: 40px;
            margin-bottom: 40px;
            letter-spacing: 12px;
            animation: float 3s ease-in-out infinite;
        }

        .emoji-row span {
            display: inline-block;
            animation: sparkle 2s ease-in-out infinite;
        }

        .emoji-row span:nth-child(2) { animation-delay: 0.2s; }
        .emoji-row span:nth-child(3) { animation-delay: 0.4s; }
        .emoji-row span:nth-child(4) { animation-delay: 0.6s; }
        .emoji-row span:nth-child(5) { animation-delay: 0.8s; }

        .time-display {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin: 40px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 110px;
            padding: 15px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(217, 119, 87, 0.1) 0%, rgba(184, 93, 58, 0.05) 100%);
            transition: all 0.3s ease;
        }

        .time-unit:hover {
            background: linear-gradient(135deg, rgba(217, 119, 87, 0.2) 0%, rgba(184, 93, 58, 0.1) 100%);
            transform: translateY(-5px);
        }

        .time-number {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #d97757 0%, #b85d3a 50%, #9d4a2f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 10px;
            font-family: 'Arial Black', Arial, sans-serif;
            letter-spacing: -2px;
            animation: pulse 2s ease-in-out infinite;
        }

        .time-label {
            font-size: 16px;
            color: #8b6f5e;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider {
            width: 2px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, #d4c4b8, transparent);
            border-radius: 2px;
        }

        .target-date {
            background: linear-gradient(135deg, #d97757 0%, #b85d3a 100%);
            border-radius: 16px;
            padding: 20px;
            margin-top: 40px;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            box-shadow: 0 4px 15px rgba(217, 119, 87, 0.3);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .expired {
            color: #8b6f5e;
        }

        @media (max-width: 600px) {
            .time-number {
                font-size: 56px;
            }
            
            .time-label {
                font-size: 14px;
            }
            
            .countdown-box {
                padding: 40px 25px;
            }
            
            .divider {
                display: none;
            }

            .emoji-row {
                font-size: 32px;
                letter-spacing: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="countdown-box">
        <div class="emoji-row">
            <span>✨</span> <span>🦃</span> <span>🍻</span> <span>🍷</span> <span>✨</span>
        </div>
        
        <div class="time-display">
            <div class="time-unit">
                <div class="time-number" id="days">--</div>
                <div class="time-label">days</div>
            </div>
            <div class="divider"></div>
            <div class="time-unit">
                <div class="time-number" id="hours">--</div>
                <div class="time-label">hours</div>
            </div>
            <div class="divider"></div>
            <div class="time-unit">
                <div class="time-number" id="minutes">--</div>
                <div class="time-label">minutes</div>
            </div>
            <div class="divider"></div>
            <div class="time-unit">
                <div class="time-number" id="seconds">--</div>
                <div class="time-label">seconds</div>
            </div>
        </div>
        
        <div class="target-date" id="target-date"></div>
    </div>

    <script>
        // SET YOUR TARGET DATE/TIME HERE
        // Format: 'YYYY-MM-DDTHH:MM:SS' (24-hour format)
        // Wednesday, November 26, 2025 at 9pm EST
        const targetDate = new Date('2025-11-26T21:00:00-05:00').getTime();

        // Create falling leaves
        function createLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'leaf';
            leaf.textContent = ['🍂', '🍁', '🍃'][Math.floor(Math.random() * 3)];
            leaf.style.left = Math.random() * 100 + '%';
            leaf.style.animationDuration = (Math.random() * 3 + 5) + 's';
            leaf.style.animationDelay = Math.random() * 2 + 's';
            document.body.appendChild(leaf);

            setTimeout(() => {
                leaf.remove();
            }, 8000);
        }

        // Create leaves periodically
        setInterval(createLeaf, 800);
        for (let i = 0; i < 5; i++) {
            setTimeout(createLeaf, i * 200);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { 
                month: 'long', 
                day: 'numeric', 
                year: 'numeric' 
            });
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = days >= 0 ? String(days).padStart(2, '0') : '00';
            document.getElementById('hours').textContent = hours >= 0 ? String(hours).padStart(2, '0') : '00';
            document.getElementById('minutes').textContent = minutes >= 0 ? String(minutes).padStart(2, '0') : '00';
            document.getElementById('seconds').textContent = seconds >= 0 ? String(seconds).padStart(2, '0') : '00';

            const targetDateElement = document.getElementById('target-date');
            const target = new Date(targetDate);
            targetDateElement.textContent = formatDate(target);

            if (distance < 0) {
                targetDateElement.textContent = '🎉🍻 Time to party! 🍻🎉';
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
